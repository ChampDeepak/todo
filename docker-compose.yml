# Full three-tier stack. `docker compose up --build` starts database, API and
# web server with no other setup on the machine.
#
# Host port choices: 5433 and 8001 because another project on this machine
# already owns 5432 and 8000. Inside the compose network the services always
# reach each other on their real ports (db:5432, backend:8000) by service name,
# so the host mapping is purely a convenience for your browser and psql.
services:
  db:
    image: postgres:16-alpine
    container_name: taskr-db
    environment:
      POSTGRES_USER: taskr
      POSTGRES_PASSWORD: taskr
      POSTGRES_DB: taskr
    ports:
      - "5433:5432"
    volumes:
      # Named volume: the database survives `docker compose down`. Without it
      # every restart wipes your data, which also means you never notice that
      # your migrations are not idempotent.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "Container started" is not "ready to accept connections". pg_isready is
      # what tells compose the difference.
      test: ["CMD-SHELL", "pg_isready -U taskr -d taskr"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: taskr-backend
    environment:
      # db:5432 -- the service name, resolved by compose's internal DNS. Never
      # localhost: inside a container, localhost is that container.
      DATABASE_URL: postgresql+psycopg://taskr:taskr@db:5432/taskr
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: docker
    depends_on:
      db:
        # service_healthy, not just service_started. Otherwise the backend
        # races Postgres' startup and the first migration fails.
        condition: service_healthy
    ports:
      - "8001:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: taskr-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 8080 inside, because a non-root process cannot bind a port below 1024.
      - "3000:8080"
    restart: unless-stopped

volumes:
  pgdata:
