# Local development stack. Extended with frontend/backend services in M4.
services:
  db:
    image: postgres:16-alpine
    container_name: taskr-db
    environment:
      POSTGRES_USER: taskr
      POSTGRES_PASSWORD: taskr
      POSTGRES_DB: taskr
    ports:
      # Host port 5433 because another project on this machine already owns 5432.
      # Inside the compose network the service is still reached as db:5432.
      - "5433:5432"
    volumes:
      # Named volume: the database survives `docker compose down`. Without it
      # every restart wipes your data, which also means you never notice that
      # your migrations are not idempotent.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Compose uses this to decide when the database is genuinely accepting
      # connections. "Container started" is not the same as "ready".
      test: ["CMD-SHELL", "pg_isready -U taskr -d taskr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
