# Full nginx.conf, not a conf.d snippet, because running as a non-root user
# requires moving the pid file and every temp path out of root-owned
# directories and into /tmp.
pid /tmp/nginx.pid;
worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # All of these default to root-owned paths under /var/cache/nginx.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        # Port 8080, not 80: ports below 1024 are privileged and a non-root
        # process cannot bind them.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Same-origin proxy. The browser only ever talks to this server, so the
        # frontend needs no backend URL baked in at build time and no CORS
        # preflight happens. `backend` resolves over the compose network; in M8
        # the Ingress performs the identical routing.
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /health {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }

        # Hashed asset filenames are immutable, so cache them hard.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback: React Router owns the URL space, so any unknown path
        # must return index.html rather than a 404.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
