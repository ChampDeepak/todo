{{- if .Values.postgres.enabled }}
# ---------------------------------------------------------------------------
# PostgreSQL. Running a database inside the cluster is fine for a demo and
# wrong for production: you would use RDS, so that backups, failover, patching
# and point-in-time recovery are someone else's full-time job rather than
# yours. Say this out loud in your presentation -- it is the single most
# common "why did you do it that way" question.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: {{ .Values.namespace }}
  labels: {{- include "taskr.labels" . | nindent 4 }}
type: Opaque
stringData:
  # A Kubernetes Secret is base64-encoded, NOT encrypted, and anyone with get
  # access to secrets in this namespace can read it. Real protection comes from
  # RBAC plus encryption-at-rest on etcd, or from an external secret store.
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@db:5432/{{ .Values.postgres.database }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: {{ .Values.namespace }}
  labels: {{- include "taskr.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: {{ .Values.namespace }}
  labels: {{- include "taskr.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: two Postgres pods must never hold the same
    # volume at once. ReadWriteOnce would block it anyway, leaving the new pod
    # stuck in ContainerCreating and the rollout hung.
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        {{- include "taskr.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            # The official image refuses to initialise into a non-empty
            # directory, and a mounted PVC always contains lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.username }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: {{ .Values.namespace }}
  labels: {{- include "taskr.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
