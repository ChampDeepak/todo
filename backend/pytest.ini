[pytest]
# Tests live in tests/ and import the app as a package from this directory.
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -q quiet, --strict-markers rejects typos in @pytest.mark names rather than
# silently skipping, -p no:cacheprovider keeps CI runners from writing caches.
addopts = -q --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning
