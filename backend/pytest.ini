[pytest]
# pythonpath lets `import app...` work without installing the package or
# exporting PYTHONPATH. CI runners get this for free.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
# -q keeps CI logs short; --strict-markers turns a typo'd @pytest.mark into an
# error instead of a silently ignored marker.
addopts = -q --strict-markers --tb=short
